services:
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports: ["6379:6379"]
  api:
    build: .
    depends_on: [redis]
    environment:
      REDIS_URL: redis://redis:6379
      PORT: 3000
      APP_API_TOKEN: dev-token
      ADMIN_API_TOKEN: dev-admin-token
    ports: ["3000:3000"]
  worker:
    build: .
    command: ["node", "dist/src/worker.js"]
    depends_on: [redis]
    environment:
      REDIS_URL: redis://redis:6379
      QUEUE_CONCURRENCY: 4
