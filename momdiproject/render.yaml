services:
  - type: web
    name: enrichment-service
    runtime: node
    buildCommand: npm install --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: enrichment-redis
          property: connectionString
      - key: APP_AUTH_TOKEN
        sync: false
      - key: SEAMLESS_API_KEY_PRIMARY
        sync: false
      - key: PROVIDER_BASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
  - type: keyvalue
    name: enrichment-redis
    plan: free
    ipAllowList: []
