services:
  - type: web
    name: prospecting-beast-v26
    runtime: node
    buildCommand: npm install --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: prospecting-beast-redis
          property: connectionString
      - key: APP_AUTH_TOKEN
        sync: false
      - key: SEAMLESS_MCP_API_KEY
        sync: false
      - key: SEAMLESS_MCP_BASE_URL
        value: https://mcp.seamless.ai/mcp
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
  - type: keyvalue
    name: prospecting-beast-redis
    plan: free
    ipAllowList: []
